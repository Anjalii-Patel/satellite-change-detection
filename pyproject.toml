[project]
name = "scd"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "rs-toolkit @ git+https://github.com/Anjalii-Patel/remotesensing-toolkit.git@v0.1.0",
  "torch", "pyyaml", "scikit-learn", "matplotlib",
]
[project.optional-dependencies]
dev = ["pytest"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]